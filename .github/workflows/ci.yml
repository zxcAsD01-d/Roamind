name: Validate source release
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: python -m venv .venv
      - run: .venv/bin/python -m pip install -r server/requirements-core.txt
      - run: npm run build
      - run: npm run test:core
      - run: python scripts/audit_release.py --tracked
